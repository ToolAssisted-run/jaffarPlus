    - name: Installing apt packages
      run: sudo apt install libgtest-dev libnuma-dev libtbb-dev libsdl2-dev libsdl2-image-dev libvorbis-dev
    - name: Building the quickerRAWGL submodule
      # Build only: the submodule's tests require Another World game files that
      # cannot be shipped in public CI (its own CI disables them for the same reason).
      run: |
