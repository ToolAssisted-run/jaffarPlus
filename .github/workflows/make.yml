  # Build (QuickerDSDA)
  build-QuickerDSDA:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Checkout QuickerDSDA
      run: | 
            git submodule init extern/quickerDSDA
            git submodule update --recursive extern/quickerDSDA
    - name: Create build directory
      run: mkdir build
    - name: Installing meson and ninja
      run: python3 -m pip install meson ninja
    - name: Updating Apt
      run: sudo apt update
    - name: Installing apt packages
      run: sudo apt install libgtest-dev libnuma-dev libtbb-dev libsdl2-dev libsdl2-image-dev libvorbis-dev
    - name: Building and testing the quickerDSDA submodule
      run: |
            git -C extern/quickerDSDA submodule update --init --recursive
            meson setup extern/quickerDSDA/build extern/quickerDSDA -DonlyFree=true
            ninja -C extern/quickerDSDA/build
            # Serial test execution (--num-processes 1): the quickerDSDA testers
            # (pTester/tTester) are multi-threaded, and with OMP_PROC_BIND=true on a
            # 2-core runner meson's default parallel test run oversubscribes the pinned
            # cores -> the engine's per-thread sched_getcpu indexing collides and crashes
            # (the job appears "cancelled"). One multi-threaded test at a time stays 1:1.
            meson test -C extern/quickerDSDA/build --num-processes 1
    - name: Run meson configuration
      run: meson setup build -Dbuildtype=release -DuseNCurses=false -Demulator=QuickerDSDA
    - name: Building project
      run: ninja -C build
    - name: Validating examples
      run: meson test ValidateExamples -C build --num-processes 1
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: meson-logs-QuickerDSDA
        path: build/meson-logs/

  # Build (NesHawk) -- header-only C++ translation of BizHawk's NesHawk core. The submodule
